# ------------------------------
# GitHub Actions Workflow: Deploy Portfolio Site to GitHub Pages
# ------------------------------

name: Deploy to GitHub Pages   # The workflow’s name (shows in Actions tab)

on:                           # Defines when this workflow should run
  push:                       # Trigger: whenever code is pushed
    branches:
      - main                  # Only run when pushing to the "main" branch

jobs:                         # A workflow is made of jobs (tasks)
  deploy:                     # Job name (you can call it anything)
    runs-on: ubuntu-latest    # Use GitHub’s latest Ubuntu runner (virtual machine)

    steps:                    # Steps are executed in order inside the job
      - name: Checkout code
        uses: actions/checkout@v3
        # Pulls your repository code into the runner so the workflow can access files

      - name: Setup Pages
        uses: actions/configure-pages@v5
        # Configures GitHub Pages with recommended settings (v5 = latest, secure)

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .             # Uploads all files in the repo root (index.html, css, js)
        # This packages your site files into an artifact for deployment

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        # Takes the uploaded artifact and publishes it to GitHub Pages
        # Your site becomes live at https://Pri-hub.github.io/Portfolio/
