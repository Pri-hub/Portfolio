# -------------------------------------------------------
# GitHub Actions Workflow: Deploy Portfolio Site to GitHub Pages
# -------------------------------------------------------
# This file tells GitHub how to automatically publish your site
# whenever you push changes to the "main" branch.
# -------------------------------------------------------

name: Deploy to GitHub Pages   # Workflow name (shows in GitHub Actions tab)

# -------------------------------------------------------
# Trigger: When does this workflow run?
# -------------------------------------------------------
on:
  push:                       # Run workflow when code is pushed
    branches:
      - main                  # Only run when pushing to "main" branch

# -------------------------------------------------------
# Jobs: What tasks should GitHub perform?
# -------------------------------------------------------
jobs:
  deploy:                     # Job name
    runs-on: ubuntu-latest    # Use latest Ubuntu runner (virtual machine)

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v3
        # This pulls your repository code into the runner
        # so the workflow can access your files.

      # Step 2: Setup GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5
        # This configures GitHub Pages with the latest version (v5).
        # v5 is recommended because it has better security, performance,
        # and compatibility with modern site generators.

      # Step 3: Upload site files
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
        # This step uploads all files in your repo (the "." means current folder).
        # These files will be deployed to GitHub Pages.

      # Step 4: Deploy site live
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v2
        # This takes the uploaded files and publishes them
        # to your GitHub Pages site (https://username.github.io/).
